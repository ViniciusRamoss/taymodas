<footer class="on-dark mt-16 bg-preto text-white/80">
  <div class="mx-auto grid max-w-6xl gap-8 px-4 py-10 text-sm leading-relaxed sm:grid-cols-3">
    <div>
      {% include "partials/wordmark.html" with size="small" %}
      <address class="mt-3 not-italic">
        Rua Onofre Serafim, 148<br>
        Serrana-SP
      </address>
    </div>

    {% if store.delivery_info %}
      <div>
        <h2 class="font-display text-lg text-white">Entrega</h2>
        <p class="mt-2">{{ store.delivery_info|linebreaksbr }}</p>
      </div>
    {% endif %}

    {% if store.instagram_handle %}
      <div>
        <h2 class="font-display text-lg text-white">Novidades toda semana</h2>
        <a class="mt-2 inline-block text-ouro underline-offset-4 hover:underline"
           href="https://instagram.com/{{ store.instagram_handle }}" rel="noopener">
          Siga @{{ store.instagram_handle }} no Instagram
        </a>
      </div>
    {% endif %}
  </div>
</footer>
