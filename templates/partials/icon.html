{% comment %}

{% endcomment %}<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="{{ class|default:'size-6' }}">

  {% elif name == "pin" %}<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/>

  {% elif name == "bag" %}<path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"/>
  {% elif name == "arrow-out" %}<path d="M8 16 16 8M9.5 8H16v6.5"/>
  {% endif %}
</svg>
